name: Daily Backend Knowledge Push

on:
  schedule:
    # 每天 06:02 北京时间（UTC+8）= 前一天 22:02 UTC
    - cron: "2 22 * * *"
    # 每天 18:02 北京时间（UTC+8）= 10:02 UTC
    # 避开整点高峰：GitHub 定时任务在整点前后负载高时会被排队延迟
    - cron: "2 10 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "测试模式：追加时间戳，避免重复内容被 PushPlus 拦截"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-backend-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Push today's knowledge to WeChat
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: python scripts/daily_push.py
